[package]
name = "qevedo-simulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Python bindings of the qvd quantum circuit simulator (qevedo.simulator)"
license = "MIT"
repository = "https://github.com/qevedo/qvd-simulator"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
qvd = { path = ".." }
num-complex = "0.4.6"
pyo3 = { version = "=0.29.2", features = ["abi3-py310", "num-complex", "multiple-pymethods"] }

[profile.release]
lto = "fat"
codegen-units = 1
